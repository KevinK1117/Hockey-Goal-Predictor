name: DEL Import Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-del:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas lxml

      - name: Test DEL statistics import
        run: python del_update.py
